<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Diet2Fit Client Portal</title>
  <meta name="description" content="Login to your Diet2Fit client portal to track your progress, view diet plans, and connect with Dt. Disha." />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .login-bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-2xl);
      position: relative;
      z-index: 1;
    }
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
      z-index: 10;
      pointer-events: auto;
      user-select: none;
    }
    .password-toggle:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="login-page">
    <!-- Background blobs -->
    <div class="login-bg-blob" style="width:500px;height:500px;background:var(--primary-glow);top:-150px;right:-100px;"></div>
    <div class="login-bg-blob" style="width:400px;height:400px;background:var(--accent-glow);bottom:-100px;left:-100px;"></div>

    <div class="login-card glass" style="border-radius: var(--radius-2xl);">
      <!-- Logo -->
      <div class="text-center mb-xl">
        <a href="/" style="font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--primary);display:inline-block;margin-bottom:var(--space-sm);">Diet2Fit</a>
        <p style="color:var(--text-secondary);">Sign in to your client portal</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="flex flex-col gap-lg" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-group" style="position:relative;">
          <label class="form-label" for="password">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" class="form-input w-full" placeholder="Enter your password" required autocomplete="current-password" />
            <span class="material-symbols-outlined password-toggle" onclick="togglePassword()">visibility_off</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full" id="btnLogin">
          <span class="material-symbols-outlined">login</span>
          Sign In
        </button>
      </form>

      <div style="margin-top: var(--space-xl); text-align: center;">
        <p style="color: var(--text-muted); font-size: 0.85rem;">
          Don't have an account? Contact Dt. Disha to get started.
        </p>
        <a href="https://wa.me/918306404335?text=Hi%20Dt.%20Disha!%20I%27d%20like%20to%20create%20my%20Diet2Fit%20account." target="_blank" class="btn btn-ghost btn-sm" style="margin-top: var(--space-sm);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#25d366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Contact via WhatsApp
        </a>
      </div>

      <!-- Divider -->
      <div style="margin-top: var(--space-lg); padding-top: var(--space-lg); border-top: 1px solid var(--border); text-align: center;">
        <a href="/" class="btn btn-ghost btn-sm">
          <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span>
          Back to Diet2Fit
        </a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/main.js"></script>
  <script>
    // Redirect if already logged in
    if (Diet2Fit.isLoggedIn()) {
      const user = Diet2Fit.getUser();
      if (user && user.role === 'admin') {
        window.location.href = '/admin/';
      } else {
        window.location.href = '/portal/';
      }
    }

    function togglePassword() {
      const pwd = document.getElementById('password');
      const toggle = document.querySelector('.password-toggle');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        toggle.textContent = 'visibility';
      } else {
        pwd.type = 'password';
        toggle.textContent = 'visibility_off';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Signing in...';

      try {
        const data = await Diet2Fit.apiRequest('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });

        Diet2Fit.setAuth(data.token, data.user);
        Diet2Fit.showToast(`Welcome back, ${data.user.name}!`, 'success');

        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = '/admin/';
          } else {
            window.location.href = '/portal/';
          }
        }, 500);
      } catch (err) {
        Diet2Fit.showToast(err.message || 'Login failed. Check your credentials.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined">login</span> Sign In';
      }
    }
  </script>
</body>
</html>
